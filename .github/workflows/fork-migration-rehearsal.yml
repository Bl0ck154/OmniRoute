name: Fork migration rehearsal (synthetic old schema)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMNIROUTE_DISABLE_BACKGROUND_SERVICES: 'true'
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - name: Stage historical fork migration SQL only (no user data)
        run: |
          git fetch --no-tags --depth=1 origin d641017972ea23884ea1569bcbcb20affcd48158
          mkdir -p "$RUNNER_TEMP/old-migrations"
          git archive FETCH_HEAD:src/lib/db/migrations | tar -x -C "$RUNNER_TEMP/old-migrations"
      - name: Seed old fork SQLite schema using synthetic data
        run: |
          node --import tsx/esm tests/scripts/offhost-fork-migration-rehearsal.mjs seed "$RUNNER_TEMP/fork-upgrade.sqlite" "$RUNNER_TEMP/old-migrations"
      - name: Apply current upstream integration to the old fork schema
        run: |
          node --import tsx/esm tests/scripts/offhost-fork-migration-rehearsal.mjs upgrade "$RUNNER_TEMP/fork-upgrade.sqlite" src/lib/db/migrations
