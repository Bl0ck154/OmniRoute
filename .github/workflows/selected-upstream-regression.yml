name: Selected upstream regressions

on:
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JWT_SECRET: ci-test-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      API_KEY_SECRET: ci-test-api-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      INITIAL_PASSWORD: ci-only-password
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
      OMNIROUTE_DISABLE_BACKGROUND_SERVICES: 'true'
      OMNIROUTE_SKIP_SYSTEM_TRUST: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate selected upstream regressions
        run: |
          node --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts \
            --import ./tests/_setup/isolateDataDir.ts \
            --test --test-force-exit --test-concurrency=2 \
            tests/unit/antigravity-claude-55-live-tier-ids.test.ts \
            tests/unit/claude-sonnet-5-5.test.ts \
            tests/unit/claude-opus-5-5.test.ts \
            tests/unit/claude-haiku-no-adaptive-thinking.test.ts \
            tests/unit/claude-codex-identity-version-sync.test.ts \
            tests/unit/claude-mid-system-models-16127.test.ts \
            tests/unit/claude-mid-system-passthrough-16127.test.ts \
            tests/unit/pricing-fallback.test.ts \
            tests/unit/agentic-executor-fallback.test.ts \
            tests/unit/antigravity-38-flash-tiered-only-account-15659.test.ts \
            tests/unit/antigravity-model-aliases.test.ts \
            tests/unit/breaker-network-error-guard.test.ts \
            tests/unit/buffered-responses-failure.test.ts \
            tests/unit/codex-overload-scope.test.ts \
            tests/unit/combo-auto-candidate-expansion.test.ts \
            tests/unit/combo-stale-auto-prune-13505.test.ts \
            tests/unit/combo-stale-model-refs-13505.test.ts \
            tests/unit/combo/quota-weighted-model-window.test.ts \
            tests/unit/feature-flags-settings.test.ts \
            tests/unit/provider-availability.test.ts \
            tests/unit/providers-client-route-secrets-qxg2.test.ts \
            tests/unit/resilience-connections.test.ts \
            tests/unit/responses-keepalive-error-frame-nested.test.ts \
            tests/unit/responses-readable-compaction.test.ts \
            tests/unit/account-fallback-retry-after-json.test.ts \
            tests/unit/classify429.test.ts \
            tests/unit/responses-transformer-tail-drain.test.ts \
            tests/unit/stream-readiness-replay-rejection-16364.test.ts \
            tests/unit/call-log-artifact-file-perms.test.ts \
            tests/unit/chat-helpers.test.ts \
            tests/unit/cli-tokens-scope-escalation.test.ts \
            tests/unit/cli-tools-refuse-to-clobber.test.ts \
            tests/unit/codex-reasoning-replay-retry.test.ts \
            tests/unit/codex-sse-overloaded-output-3232.test.ts \
            tests/unit/combo-model-lock-pre-dispatch-wait-16319.test.ts \
            tests/unit/combos-list-shared-context-resolution.test.ts \
            tests/unit/omp-settings-route.test.ts \
            tests/unit/request-logger-url-secret-masking.test.ts \
            tests/unit/stream-continuation-responses.test.ts \
            tests/unit/usage/usageWriteRetry.test.ts \
            tests/unit/deferred-locked-db-write.test.ts \
            tests/unit/db-fork-preferred-connections-194-to-213.test.ts \
            tests/unit/vscode-token-routes.test.ts \
            tests/unit/codex-tools-schema-value-shapes.test.ts \
            tests/unit/codex-tools-unicode-property-pattern.test.ts \
            tests/unit/gemini-tool-schema-value-shapes.test.ts \
            tests/unit/openai-claude-tool-controls-4171.test.ts \
            tests/unit/openai-tool-call-id-normalization.test.ts \
            tests/unit/param-support-claude-diagnostics.test.ts \
            tests/unit/chatcore-streaming-pipeline.test.ts \
            tests/unit/order-forge-image-artifact-sink.test.ts \
            tests/unit/stream-keeps-generated-images.test.ts \
            tests/unit/http-client-abort-guard-empty-response-16347.test.ts \
            tests/unit/release-version-workspace-consistency.test.ts \
            tests/unit/server-owned-tool-loop-flag.test.ts \
            tests/unit/bug-8020-codex-peek-body-timeout.test.ts
      - name: UI provider availability (Vitest / jsdom)
        run: ./node_modules/.bin/vitest run tests/unit/ui/resilience-connections.test.tsx --maxWorkers=2
      - name: Typecheck core
        if: success() || failure()
        run: npm run typecheck:core
      - name: Typecheck open-sse
        if: success() || failure()
        run: npm run check:open-sse-typecheck
